appId: com.hismindset.hissoundboard
productName: HISSOUNDBOARD
directories:
  output: release
  buildResources: resources

# No native module needs recompiling: uiohook-napi ships ABI-stable N-API
# prebuilds. Skipping the rebuild avoids @electron/rebuild's node-abi lag on new
# Electron releases (e.g. Electron 42) and keeps cross-platform builds working.
npmRebuild: false

files:
  - dist/**/*
  - resources/**/*
  - remote/**/*
  - package.json
  # Native modules are automatically handled, but we can be explicit if needed
  # - node_modules/**/* # usually not needed as builder handles dependencies
  # IMPORTANT: drop the host-compiled native binary so node-gyp-build falls back
  # to the correct prebuilds/<platform>-<arch>. Without this, a macOS build/Release
  # binary gets loaded first on Linux/Windows and crashes (cross-build safety).
  - "!node_modules/uiohook-napi/build/**"
  - "!node_modules/uiohook-napi/bin/**"

# Unpack native modules
asarUnpack:
  - "**/*.node"
  - "**/uiohook-napi/**"

mac:
  target: dmg
  icon: resources/icon.icns
  # Ad-hoc sign the bundle. identity: '-' tells electron-builder to sign with the
  # ad-hoc identity (no Apple Developer certificate required) instead of leaving
  # the binary fully unsigned. On Apple Silicon (macos-latest CI runner) an
  # unsigned .app triggers Gatekeeper's "is beschädigt und kann nicht geöffnet
  # werden" dialog when launched from a freshly downloaded DMG. Ad-hoc signing
  # is enough to satisfy the quarantine check while still avoiding any paid
  # signing identity. See: https://www.electron.build/configuration/mac#identity
  identity: "-"
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  hardenedRuntime: false
  gatekeeperAssess: false
  # Required so macOS shows the microphone permission prompt for the soundboard passthrough.
  extendInfo:
    NSMicrophoneUsageDescription: "HISSOUNDBOARD routes your microphone into voice chat together with your sounds."

dmg:
  sign: false

win:
  # Keep the installer name stable and in sync with the path published in
  # latest.yml, which electron-updater uses to download Windows updates.
  artifactName: "${productName}.Setup.${version}.${ext}"
  # Pin to x64 explicitly: without an arch, electron-builder cross-builds for
  # the HOST architecture, so building on Apple Silicon silently produces a
  # Windows-on-ARM64 installer that can't run on ordinary (x64) Windows PCs.
  # x64 also runs fine under Windows 11 ARM's built-in x64 emulation, so this
  # doesn't lose ARM support, it just avoids shipping an ARM64-only binary by
  # accident. GitHub Actions' windows-latest runner is x64 already, so CI
  # builds are unaffected by this change.
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: HISSOUNDBOARD

linux:
  target: AppImage
  icon: resources/icon.png
  category: Audio

# Publish configuration (for GitHub Actions)
publish:
  provider: github
  owner: hismindset
  repo: hissoundboard
